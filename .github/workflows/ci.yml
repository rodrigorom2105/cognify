name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every failing check, not just the first one.
      fail-fast: false
      matrix:
        include:
          - name: Lint
            script: lint
          - name: Type-check
            script: type-check
          - name: Test
            script: test
    steps:
      - uses: actions/checkout@v5

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.script }}
